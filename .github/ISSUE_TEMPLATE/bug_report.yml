name: Bug report / 问题反馈
description: Report a reproducible defect / 提交可复现的问题
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected behavior / 复现步骤与预期行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: OS, Python, Node.js, MySQL, CPU/GPU versions. Do not include credentials.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots / 脱敏日志或截图
